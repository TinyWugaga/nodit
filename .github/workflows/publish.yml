name: Publish to npm

# A pushed tag v<semver> publishes that version. The tag must equal package.json's version
# and point at a commit on main; scripts/release-tag.ts enforces the rest.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC); no npm token is stored in GitHub

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME 指向的 commit 不在 main 上"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # npm 12.0.0 ships without sigstore and cannot publish (decision 0006)
      - run: npm install -g npm@12.2.1

      - run: npm ci

      - name: Check tag against package.json and npm
        id: release
        run: npx tsx scripts/release-tag.ts "$GITHUB_REF_NAME"

      - run: npm run typecheck
      - run: npm test

      # prepack runs the full build
      - run: npm publish --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
